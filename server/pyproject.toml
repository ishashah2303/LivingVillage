[project]
name = "living-village-planner"
version = "0.2.0"
description = "Deliberative planner service for Living Village (rule-based today, LLM later)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.115",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
